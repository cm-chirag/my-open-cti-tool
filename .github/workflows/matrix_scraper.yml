name: Enterprise Threat Matrix Sync

on:
  schedule:
    - cron: '0 */4 * * *' # Executes automated scraping tasks every 4 hours automatically
  workflow_dispatch:      # Retains manual invocation buttons inside repository dashboards

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Codebase Clone Step
        uses: actions/checkout@v4

      - name: Prepare Python Cloud Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy Networking Library Core
        run: pip install requests

      - name: Trigger Processing Pipeline Architecture
        run: python src/matrix_engine.py

      - name: Automated Repository Commit Engine
        run: |
          git config --global user.name "CTI-Matrix-Bot"
          git config --global user.email "matrix-bot@users.noreply.github.com"
          git add industry_feeds/
          git diff-index --quiet HEAD || git commit -m "Automated Matrix Update: $(date -u)"
          git push

          
